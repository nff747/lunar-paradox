<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep space radial gradient -->
    <radialGradient id="spaceVignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e071e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#030108" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#010004" stop-opacity="1.0"/>
    </radialGradient>

    <!-- Cyan Luminous Aura -->
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#80d8ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030108" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon Texture & Lighting Gradient -->
    <radialGradient id="moonSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#030108"/>

  <!-- Cosmic Radial Glow Centered -->
  <circle cx="600" cy="240" r="380" fill="url(#cyanAura)"/>
  <rect width="1200" height="630" fill="url(#spaceVignette)"/>

  <!-- Distant subtle stars -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="140" r="1"/>
    <circle cx="420" cy="70" r="2"/>
    <circle cx="950" cy="110" r="1.5"/>
    <circle cx="1080" cy="200" r="1"/>
    <circle cx="1120" cy="80" r="2"/>
    <circle cx="160" cy="480" r="1"/>
    <circle cx="1040" cy="520" r="1.5"/>
    <circle cx="890" cy="430" r="1"/>
  </g>

  <!-- 3D Celestial Moon Art -->
  <g transform="translate(600, 220)">
    <!-- Atmospheric Corona Rim -->
    <circle cx="0" cy="0" r="116" fill="none" stroke="#80d8ff" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="112" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Moon Solid -->
    <circle cx="0" cy="0" r="110" fill="url(#moonSphere)"/>
    
    <!-- Shadow Mask to Form Crescent -->
    <path d="M 0 -110 A 110 110 0 0 0 65 89 A 110 110 0 1 1 0 -110 Z" fill="#030108" opacity="0.95"/>
    
    <!-- Radiant Cyan Rim Arc -->
    <path d="M -78 -78 A 110 110 0 0 0 0 110 A 110 110 0 0 0 88 66" stroke="#80d8ff" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>
  </g>

  <!-- Typography & Brand -->
  <!-- Main Title -->
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="8">
    LUNAR PARADOX
  </text>

  <!-- Tagline -->
  <text x="600" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="18" fill="#94a3b8" letter-spacing="3">
    AUTONOMOUS DESIGN &amp; SPATIAL ENGINEERING
  </text>

  <!-- Subdomain Pills Container -->
  <g transform="translate(600, 530)">
    <!-- Studio Pill -->
    <g transform="translate(-240, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-weight="600" font-size="12" fill="#e2e8f0" letter-spacing="1">STUDIO ↗</text>
    </g>

    <!-- Forge Pill (Free) -->
    <g transform="translate(-80, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-weight="600" font-size="12" fill="#d8b4fe" letter-spacing="1">FORGE [FREE]</text>
    </g>

    <!-- Labs Pill -->
    <g transform="translate(80, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-weight="600" font-size="12" fill="#e2e8f0" letter-spacing="1">LABS ↗</text>
    </g>

    <!-- Vault Pill -->
    <g transform="translate(240, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-weight="600" font-size="12" fill="#e2e8f0" letter-spacing="1">VAULT ↗</text>
    </g>
  </g>

  <!-- Clean Bottom Domain Badge -->
  <text x="600" y="595" text-anchor="middle" font-family="monospace" font-weight="500" font-size="13" fill="#64748b" letter-spacing="2">
    lunarparadox.com
  </text>
</svg>
