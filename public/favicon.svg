<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Cosmic Dark Field -->
  <circle cx="32" cy="32" r="30" fill="#030108" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Glowing Moon Sphere -->
  <circle cx="32" cy="32" r="21" fill="url(#moonGlow)"/>
  
  <!-- Shadow overlay to create the signature celestial crescent -->
  <path d="M 32 11 A 21 21 0 0 0 45 48.5 A 21 21 0 1 1 32 11 Z" fill="#030108" opacity="0.94"/>
  
  <!-- Luminous Cyan Rim Arc -->
  <path d="M 14.5 22 A 21 21 0 0 0 32 53 A 21 21 0 0 0 49.5 42" stroke="#80d8ff" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#cyanGlow)"/>
</svg>
